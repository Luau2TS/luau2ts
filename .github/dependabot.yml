version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels: ['dependencies']
    groups:
      typescript-tooling:
        patterns: ['typescript', '@types/*', '@vitest/*', 'vitest']
      docusaurus:
        patterns: ['@docusaurus/*', 'prism-react-renderer']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'ci']
    groups:
      gh-actions:
        patterns: ['*']
