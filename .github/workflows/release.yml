name: Publish
run-name: Publish ${{ inputs.version }} (@${{ github.actor }})

# Triggered manually from the Actions tab. Enter the next version
# (e.g. 0.2.0). The workflow bumps package.json, publishes to npm,
# pushes the tag back, then creates a styled GitHub release whose
# body is sourced from Release Drafter (which accumulates entries
# from PR titles + labels via .github/release-drafter.yml).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Build analyzer first so its dist/ exists, then root which links
      # to it. -r alone can skip the workspace root depending on pnpm
      # version semantics, so call them explicitly.
      - run: pnpm --filter @luau2ts/analyzer build

      - run: pnpm build

      - run: pnpm test

      - name: Publish to npm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.version }} --allow-same-version -m "chore: release v%s"
          # pnpm publish (not npm publish) so workspace:* in
          # optionalDependencies expands to the analyzer's real
          # version on the registry. --no-git-checks because we just
          # bumped + amended.
          pnpm publish --access public --no-git-checks
          git push
          git push --tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Pull the release body from Release Drafter. The drafter
      # accumulates entries from merged PRs (categorized by label per
      # .github/release-drafter.yml) and exposes the rendered body as
      # a step output. `publish: false` keeps this step from creating
      # its own GitHub release; we want to compose header + body +
      # footer ourselves below.
      - name: Get release body from Release Drafter
        id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          publish: false
          tag: v${{ inputs.version }}
          name: v${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose release notes
        env:
          DRAFTER_BODY: ${{ steps.drafter.outputs.body }}
        run: |
          cat > /tmp/release-notes.md << 'HEADER'
          <div align="center">
            <img src="https://raw.githubusercontent.com/luau2ts/luau2ts/main/static/img/logo.png" alt="luau2ts" width="160" />

          # `luau2ts` v${{ inputs.version }}

          **A Luau-to-TypeScript compiler for Roblox.**

          [Docs](https://luau2ts.com) · [Playground](https://luau2ts.com/playground) · [npm](https://www.npmjs.com/package/luau2ts)
          </div>

          ---

          HEADER
          # Use printf (not echo) so backslash escapes pass through
          # unchanged. Fall back to a minimal placeholder when the
          # drafter has no PRs to summarize (e.g., releases that
          # contain only direct-to-main commits with no PR history).
          if [ -n "$DRAFTER_BODY" ]; then
            printf '%s\n' "$DRAFTER_BODY" >> /tmp/release-notes.md
          else
            echo '_No PR-labeled changes since the previous release. See the commit log for raw history._' >> /tmp/release-notes.md
          fi
          cat >> /tmp/release-notes.md << 'FOOTER'

          ## Install

          ```bash
          npm install -g luau2ts@${{ inputs.version }}
          ```

          ## Try it live

          [luau2ts.com/playground](https://luau2ts.com/playground)
          FOOTER

      - name: Create GitHub release
        run: |
          gh release create v${{ inputs.version }} \
            --title "v${{ inputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
