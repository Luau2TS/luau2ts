name: npm owner

# One-off workflow to manage npm package owners. Useful right after
# the first publish, to transfer ownership from a personal user to
# the luau2ts npm org without re-publishing.

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command shell to run (use full npm CLI)'
        required: true
        type: string
        default: 'npm owner ls luau2ts'

jobs:
  owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Run command
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -ex
          ${{ inputs.command }}
          echo "--- final owners ---"
          npm owner ls luau2ts
