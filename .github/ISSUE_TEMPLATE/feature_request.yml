name: Feature request
description: Suggest a new emit pattern, macro, CLI flag, or other improvement.
labels: ['feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Concrete use case. What are you trying to do that's currently hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the ideal API / CLI / emit look like? A sketch is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they didn't fit.
